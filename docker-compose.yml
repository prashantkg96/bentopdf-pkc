services:
  pkc-pdf-tools:
    # GitHub Container Registry (Recommended)
    # Self-Hosted build - ghcr.io/alam00000/bentopdf-simple:latest
    # Commercial build  - ghcr.io/alam00000/bentopdf:latest
    # Docker Hub (Alternative)
    # Self-Hosted build - pkcpdftools/pkc-pdf-tools-simple:latest
    # Commercial build  - pkcpdftools/pkc-pdf-tools:latest
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: pkc-pdf-tools
    restart: unless-stopped
    ports:
      - '8080:8080'
    # For IPv4-only environments
    #environment:
    #  - DISABLE_IPV6=true
