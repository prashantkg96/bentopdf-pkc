name = "bentopdf-wasm-proxy"
main = "wasm-proxy-worker.js"
compatibility_date = "2024-01-01"

# =============================================================================
# DEPLOYMENT
# =============================================================================
# Deploy this worker:
#   cd cloudflare
#   npx wrangler deploy -c wasm-wrangler.toml
#
# Set environment secrets (one of the following methods):
#   Option A: Cloudflare Dashboard
#     Go to Workers & Pages > bentopdf-wasm-proxy > Settings > Variables
#     Add: PYMUPDF_SOURCE, GS_SOURCE, CPDF_SOURCE, LIBREOFFICE_SOURCE
#
#   Option B: Wrangler CLI
#     npx wrangler secret put PYMUPDF_SOURCE -c wasm-wrangler.toml
#     npx wrangler secret put GS_SOURCE -c wasm-wrangler.toml
#     npx wrangler secret put CPDF_SOURCE -c wasm-wrangler.toml
#     npx wrangler secret put LIBREOFFICE_SOURCE -c wasm-wrangler.toml

# =============================================================================
# WASM SOURCE URLS
# =============================================================================
# Set these as secrets in the Cloudflare dashboard or via wrangler:
#
# PYMUPDF_SOURCE: Base URL to PyMuPDF WASM files
#   Example: https://cdn.jsdelivr.net/npm/@bentopdf/pymupdf-wasm/assets
#            https://your-bucket.r2.cloudflarestorage.com/pymupdf
#
# GS_SOURCE: Base URL to Ghostscript WASM files
#   Example: https://cdn.jsdelivr.net/npm/@bentopdf/gs-wasm/assets
#            https://your-bucket.r2.cloudflarestorage.com/gs
#
# CPDF_SOURCE: Base URL to CoherentPDF files
#   Example: https://cdn.jsdelivr.net/npm/coherentpdf/cpdf
#            https://your-bucket.r2.cloudflarestorage.com/cpdf
#
# LIBREOFFICE_SOURCE: Base URL to the LibreOffice WASM build (Office to PDF).
#   ~75 MB of soffice.wasm.gz + soffice.data.gz, which is why it is proxied
#   rather than shipped as a site asset (Cloudflare caps assets at 25 MiB).
#   Example: https://cdn.jsdelivr.net/npm/@matbee/libreoffice-converter/dist/wasm
#            https://your-bucket.r2.cloudflarestorage.com/libreoffice

# =============================================================================
# USAGE FROM BENTOPDF
# =============================================================================
# In PKC PDF Tools's WASM Settings page, configure URLs like:
#   PyMuPDF: https://wasm.example.com/pymupdf/
#   Ghostscript: https://wasm.example.com/gs/
#   CoherentPDF: https://wasm.example.com/cpdf/

# =============================================================================
# LIBREOFFICE PAYLOAD (R2)
# =============================================================================
# Office to PDF runs on a ~75 MB LibreOffice WASM payload (soffice.wasm.gz +
# soffice.data.gz + three glue scripts) under the "libreoffice/" prefix.
#
# Bound directly rather than proxied through a public bucket URL: the bucket
# stays private, there is no pub-*.r2.dev endpoint to rate-limit or abuse, no
# second network hop, and no DNS setup. The Worker falls back to proxying
# LIBREOFFICE_SOURCE when this binding is absent, so a self-hoster can still
# point it at any CDN instead.
#
# To repopulate the bucket, the payload is recoverable from this repo's history:
#   git cat-file -p 70e0834^:public/libreoffice-wasm/<file>
[[r2_buckets]]
binding = "LIBREOFFICE_BUCKET"
bucket_name = "pkc-pdf-tools-wasm"

# =============================================================================
# RATE LIMITING (Optional but recommended)
# =============================================================================
# Create KV namespace:
#   npx wrangler kv namespace create "RATE_LIMIT_KV"
#
# Then uncomment and update the ID below:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"

# PKC: no KV namespace exists in this Cloudflare account yet (the id below was
# an upstream pkc-pdf-tools.com placeholder, not real here). The Worker runs fine
# without it — env.RATE_LIMIT_KV is optional and rate limiting is just skipped.
# Create a namespace and uncomment to enable it later.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"

# =============================================================================
# CUSTOM DOMAIN (Optional)
# =============================================================================
# If you want a custom domain like wasm.pkc-pdf-tools.com:
# routes = [
#   { pattern = "wasm.pkc-pdf-tools.com/*", zone_name = "pkc-pdf-tools.com" }
# ]
